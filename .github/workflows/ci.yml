name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run build:binary
      - run: bun run package:app
      - run: ./dist/launchd-studio version
      - run: plutil -lint 'dist/Launchd Studio.app/Contents/Info.plist'
