name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:binary
      - run: ./dist/launchd-studio version
      - name: Sign binary
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BINARY: dist/launchd-studio
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/launchd-studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          trap 'security delete-keychain "$keychain_path" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -t cert -k "$keychain_path" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          test -n "$signing_identity"
          codesign --force --options runtime --timestamp --sign "$signing_identity" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
      - name: Package binary for notarization
        env:
          ARCHIVE: dist/launchd-studio-darwin-${{ matrix.architecture }}.zip
          BINARY: dist/launchd-studio
        run: ditto -c -k --sequesterRsrc --keepParent "$BINARY" "$ARCHIVE"
      - name: Notarize package
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ARCHIVE: dist/launchd-studio-darwin-${{ matrix.architecture }}.zip
        run: |
          set -euo pipefail
          test -n "$APPLE_NOTARY_ISSUER_ID"
          test -n "$APPLE_NOTARY_KEY_BASE64"
          test -n "$APPLE_NOTARY_KEY_ID"

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          xcrun notarytool submit "$ARCHIVE" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
      - name: Compress binary and create checksums
        env:
          BINARY: dist/launchd-studio
          ARCHIVE: dist/launchd-studio-darwin-${{ matrix.architecture }}.gz
          CHECKSUM: dist/launchd-studio-darwin-${{ matrix.architecture }}.gz.sha256
          HOMEBREW_ARCHIVE: dist/launchd-studio-darwin-${{ matrix.architecture }}.tar.gz
          HOMEBREW_CHECKSUM: dist/launchd-studio-darwin-${{ matrix.architecture }}.tar.gz.sha256
        run: |
          set -euo pipefail
          gzip -c "$BINARY" > "$ARCHIVE"
          tar -czf "$HOMEBREW_ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          test "$(tar -tzf "$HOMEBREW_ARCHIVE")" = "launchd-studio"
          (cd "$(dirname "$ARCHIVE")" && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$CHECKSUM")")
          (cd "$(dirname "$HOMEBREW_ARCHIVE")" && shasum -a 256 "$(basename "$HOMEBREW_ARCHIVE")" > "$(basename "$HOMEBREW_CHECKSUM")")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.architecture }}
          path: |
            dist/launchd-studio-darwin-${{ matrix.architecture }}.gz
            dist/launchd-studio-darwin-${{ matrix.architecture }}.gz.sha256
            dist/launchd-studio-darwin-${{ matrix.architecture }}.tar.gz
            dist/launchd-studio-darwin-${{ matrix.architecture }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create update manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          arm64_archive="dist/launchd-studio-darwin-arm64.gz"
          x64_archive="dist/launchd-studio-darwin-x64.gz"
          test -f "$arm64_archive"
          test -f "$x64_archive"

          arm64_sha256="$(sha256sum "$arm64_archive" | awk '{print $1}')"
          x64_sha256="$(sha256sum "$x64_archive" | awk '{print $1}')"
          arm64_size="$(stat -c '%s' "$arm64_archive")"
          x64_size="$(stat -c '%s' "$x64_archive")"

          jq -n \
            --arg version "$version" \
            --arg tag "$TAG" \
            --arg arm64_sha256 "$arm64_sha256" \
            --arg x64_sha256 "$x64_sha256" \
            --argjson arm64_size "$arm64_size" \
            --argjson x64_size "$x64_size" \
            '{
              schemaVersion: 1,
              version: $version,
              tag: $tag,
              platforms: {
                "darwin-arm64": { sha256: $arm64_sha256, size: $arm64_size },
                "darwin-x64": { sha256: $x64_sha256, size: $x64_size }
              }
            }' > dist/latest.json
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/*.gz dist/*.gz.sha256 dist/latest.json --verify-tag --generate-notes --title "$TAG"
